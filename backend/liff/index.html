<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DormPlus — บิลของฉัน</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{--bg:#0B0F14;--card:#121A22;--line:#24333F;--text:#E6EDF3;--muted:#8B9AAB;
        --accent:#4FD8D2;--warn:#F59E0B;--ok:#22C55E;
        --font:'IBM Plex Sans Thai',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:16px 16px 40px}
  .kicker{font-size:11px;color:var(--accent);font-weight:600}
  h1{font-size:20px;font-weight:700;margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .m{font-size:11px;color:var(--muted);line-height:1.6}
  .big{font-size:30px;font-weight:700;color:var(--accent)}
  .pill{font-size:10px;padding:3px 10px;border-radius:999px;border:1px solid rgba(79,216,210,.5);color:var(--accent)}
  .pill.warn{border-color:rgba(245,158,11,.5);color:var(--warn)}
  .btn{background:var(--accent);color:#062B14;font-weight:600;font-size:14px;text-align:center;
       padding:13px;border-radius:12px;border:none;width:100%;margin-top:12px;font-family:var(--font);cursor:pointer}
  .btn[disabled]{opacity:.5}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
  .state{font-size:12px;color:var(--muted);padding:12px 4px}
  .err{color:var(--warn)}
</style>
</head>
<body>
  <div class="kicker" id="kicker">DormPlus</div>
  <h1 id="title">บิลของฉัน</h1>
  <div id="app"><div class="state">กำลังเชื่อมต่อ LINE…</div></div>

<script>
const app = document.getElementById('app');
const title = document.getElementById('title');
const kicker = document.getElementById('kicker');

const money = (n) => (n || 0).toLocaleString('th-TH');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function fail(msg, detail) {
  app.innerHTML = '<div class="card"><div class="state err">' + esc(msg) + '</div>' +
    (detail ? '<div class="m" style="margin-top:8px">' + esc(detail) + '</div>' : '') + '</div>';
}

async function api(path, options) {
  const res = await fetch(path, Object.assign({ credentials: 'same-origin' }, options));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error((data.error && data.error.message) || res.statusText);
    err.status = res.status;
    err.code = data.error && data.error.code;
    throw err;
  }
  return data;
}

function renderBills(items) {
  if (!items.length) {
    app.innerHTML = '<div class="card"><div class="m">ยังไม่มีบิลในระบบ</div></div>';
    return;
  }
  const open = items.find(i => i.status !== 'paid') || items[0];
  title.textContent = 'บิลของฉัน';
  kicker.textContent = 'รอบ ' + open.period;

  const statusText = open.status === 'paid' ? 'ชำระแล้ว'
    : open.status === 'pending' ? 'รอตรวจสอบ' : 'ยังไม่ชำระ';

  app.innerHTML =
    '<div class="card">' +
      '<div class="row"><span class="m">ยอดที่ต้องชำระ</span>' +
        '<span class="pill' + (open.status === 'paid' ? '' : ' warn') + '">' + statusText + '</span></div>' +
      '<div class="big" style="margin-top:6px">' + money(open.total) +
        ' <span style="font-size:14px;color:var(--muted)">บาท</span></div>' +
      '<div class="m" style="margin-top:10px">ครบกำหนด ' + esc(open.due_date) + '</div>' +
    '</div>' +
    (open.status === 'unpaid'
      ? '<button class="btn" id="slipBtn">แนบสลิป &amp; แจ้งชำระ</button>' +
        '<div class="m" style="margin-top:8px">หลังแจ้งแล้ว สถานะจะเป็น “รอตรวจสอบ” จนกว่าเจ้าของหอจะยืนยัน</div>'
      : open.status === 'pending'
        ? '<div class="card"><div class="m">แจ้งชำระแล้ว — รอเจ้าของหอยืนยัน</div></div>'
        : '<div class="card"><div class="m">ใบเสร็จออกแล้ว ขอบคุณครับ</div></div>') +
    '<button class="btn ghost" id="logoutBtn" style="margin-top:16px">ออกจากระบบ</button>';

  const slipBtn = document.getElementById('slipBtn');
  if (slipBtn) {
    slipBtn.onclick = async () => {
      slipBtn.disabled = true;
      slipBtn.textContent = 'กำลังส่ง…';
      try {
        await api('/v1/invoices/' + open.id + '/slip', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          // No photo upload yet: the API records "tenant says it is paid" and the owner confirms in LINE.
          body: JSON.stringify({}),
        });
        boot();
      } catch (e) {
        slipBtn.disabled = false;
        slipBtn.textContent = 'แนบสลิป & แจ้งชำระ';
        alert(e.message);
      }
    };
  }

  document.getElementById('logoutBtn').onclick = async () => {
    await api('/v1/auth/logout', { method: 'POST' }).catch(() => {});
    if (window.liff && liff.isLoggedIn()) liff.logout();
    location.reload();
  };
}

async function boot() {
  try {
    const cfg = await api('/v1/liff-config');
    if (!cfg.liff_id) {
      return fail('ยังไม่ได้ตั้งค่า LIFF', 'ผู้ดูแลต้องใส่ LIFF_ID บนเซิร์ฟเวอร์ก่อน');
    }

    await liff.init({ liffId: cfg.liff_id });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const idToken = liff.getIDToken();
    let login;
    try {
      login = await api('/v1/auth/line', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id_token: idToken }),
      });
    } catch (e) {
      if (e.code === 'NOT_LINKED') {
        return fail('LINE นี้ยังไม่ได้ผูกกับห้อง', 'ให้เจ้าของหอเพิ่ม LINE ของคุณเข้าห้องก่อน แล้วเปิดใหม่');
      }
      throw e;
    }

    kicker.textContent = 'ห้อง ' + login.user.room_no;
    const bills = await api('/v1/me/invoices');
    renderBills(bills.items);
  } catch (e) {
    fail('เปิดหน้าไม่สำเร็จ', e.message);
  }
}

boot();
</script>
</body>
</html>
