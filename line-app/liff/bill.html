<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DormPlus</title>
<link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F14;--bar:#0F151C;--card:#121A22;--card2:#18222C;
    --line:rgba(230,237,243,.08);--line2:rgba(230,237,243,.14);
    --text:#E6EDF3;--muted:#93A1B0;--accent:#4FD8D2;
    --warn:#E3A008;--bad:#F0726B;
    --radius:12px;--gutter:16px
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-variant-numeric:tabular-nums;min-height:100vh;display:flex;justify-content:center}
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .app{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column}

  /* top bar: optional back chevron + kicker + title */
  .topbar{background:var(--bar);border-bottom:1px solid var(--line);padding:16px var(--gutter) 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  .back{background:none;border:none;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--text);margin-left:-8px;flex:none}
  .back[hidden]{display:none}
  .kick{font-size:12px;color:var(--muted);line-height:1.4}
  h1{font-size:18px;font-weight:600;line-height:1.4}

  main{flex:1;padding:16px var(--gutter) 24px;display:flex;flex-direction:column;gap:12px}
  body.has-bar main{padding-bottom:88px}
  .section{font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .m{font-size:12px;color:var(--muted);line-height:1.6}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .rows{display:flex;flex-direction:column;gap:10px;font-size:13px}
  .rows .total{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;font-weight:600}
  .big{font-size:20px;font-weight:600;line-height:1.3}
  .huge{font-size:28px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
  .unit{font-size:13px;color:var(--muted);font-weight:400}
  .progress{height:4px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:12px}
  .progress i{display:block;height:100%;background:var(--accent);border-radius:2px}

  /* counts: one card, three columns split by a hairline */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .stats .card{background:none;border:0;border-left:1px solid var(--line);border-radius:0;padding:14px 12px;cursor:pointer;text-align:left}
  .stats .card:first-child{border-left:0}
  .stats .big{margin-top:8px}

  .btn{display:block;width:100%;background:transparent;border:1px solid var(--line2);border-radius:10px;padding:12px;font-size:15px;font-weight:500;text-align:center;cursor:pointer;color:var(--text);transition:background-color .12s,transform .12s}
  .btn:active{transform:scale(.99)}
  .btn.primary{background:var(--text);border-color:var(--text);color:#0B0F14;font-weight:600}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.sm{width:auto;padding:8px 12px;font-size:13px}
  .stack{display:flex;flex-direction:column;gap:8px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bottombar{position:sticky;bottom:0;background:var(--bar);border-top:1px solid var(--line);padding:12px var(--gutter) 16px;display:flex;flex-direction:column;gap:8px}
  .bottombar[hidden]{display:none}

  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line2);background:transparent;cursor:pointer;color:var(--muted)}
  .chip.on{background:var(--card2);border-color:var(--line2);color:var(--text)}

  /* status is a dot and a quiet label, not a coloured pill */
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .pill.todo{color:var(--muted)}
  .pill.ok{color:var(--accent)}
  .pill.warn{color:var(--warn)}
  .pill.bad{color:var(--bad)}

  .roomcard{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;width:100%;text-align:left;font-size:14px}
  .roomcard b{font-weight:500}
  .roomcard .m{font-size:12px;line-height:1.5;margin-top:2px}
  .roomcard.next{box-shadow:inset 2px 0 0 var(--accent)}

  .field{display:flex;flex-direction:column;gap:8px}
  .field label{font-size:12px;color:var(--muted)}
  .in{display:flex;align-items:center;gap:8px}
  .in input{flex:1;background:var(--card);border:1px solid var(--line2);color:var(--text);border-radius:10px;padding:12px;font-family:inherit;font-size:16px;width:100%}
  .in input:disabled{opacity:.6}
  .prev{display:flex;gap:24px;margin-top:8px}
  .prev b{font-size:18px;font-weight:600}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
  .seg button{background:none;border:none;border-radius:8px;padding:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--card2);color:var(--text)}

  .slip{display:flex;gap:12px;align-items:flex-start}
  .thumb{width:52px;height:64px;border-radius:8px;background:var(--card2);border:1px solid var(--line);object-fit:cover;flex:none;display:grid;place-items:center;font-size:11px;color:var(--muted);cursor:pointer;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .qr{margin-top:12px;background:#fff;border-radius:8px;padding:12px;display:grid;place-items:center}
  .qr svg{width:100%;max-width:200px;height:auto;display:block}
  /* PromptPay placeholder on the tenant bill. Its own class: sharing .qr shrank the room QR to 132px. */
  .qr-ph{width:132px;height:132px;margin:0 auto;border:1px dashed var(--line2);border-radius:8px;display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center}
  .pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:240px;border:1px dashed var(--line2);border-radius:var(--radius);background:var(--card);cursor:pointer;text-align:center;overflow:hidden}
  .pick img{width:100%;max-height:420px;object-fit:contain;display:block}
  input[type=file]{display:none}
  .hint{font-size:12px;color:var(--muted);line-height:1.6}
  .warnText{color:var(--warn)}
  .err{color:var(--bad);font-size:13px;line-height:1.6}
  .empty{text-align:center;padding:24px 12px}

  .sheet{position:fixed;inset:0;background:rgba(4,7,10,.72);display:flex;align-items:center;justify-content:center;padding:var(--gutter);z-index:20}
  .sheet .card{width:100%;max-width:398px;max-height:90vh;overflow:auto}
  .sheet img{width:100%;border-radius:8px;margin-top:12px;display:block}

  .receipt{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 16px}
  .receipt .brand{font-size:12px;font-weight:500;color:var(--muted)}
  .receipt h2{font-size:18px;font-weight:600;margin:2px 0 4px}
  .receipt .rows{margin-top:12px}
  .opt{display:flex;align-items:center;gap:12px;font-size:13px;padding:8px 0;cursor:pointer}
  .opt input{width:18px;height:18px;accent-color:var(--accent);flex:none}
  .opt .grow{flex:1}

  .toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--card2);border:1px solid var(--line2);color:var(--text);font-size:13px;padding:10px 14px;border-radius:10px;z-index:30;opacity:0;pointer-events:none;transition:opacity .16s}
  .toast.show{opacity:1}
  .toast.err{border-color:rgba(240,114,107,.5)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="back" id="back" hidden aria-label="ย้อนกลับ">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div>
      <div class="kick" id="kick">DormPlus</div>
      <h1 id="title">กำลังโหลด…</h1>
    </div>
  </header>
  <main id="view"></main>
  <div class="bottombar" id="bottom" hidden></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const view = $("view");
const fmt = (n) => Number(n || 0).toLocaleString("th-TH");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let idToken = null;
let MYROLE = null; // owner | viewer | null
let ROOT = false; // the dorm's first owner (OWNER_USER_ID): the only one who can add owners or remove anyone

// ---------- shared UI ----------
const TH_MONTHS = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
const periodTh = (p) => (p && /^\d{4}-\d{2}$/.test(p) ? `${TH_MONTHS[Number(p.slice(5, 7)) - 1]} ${Number(p.slice(0, 4)) + 543}` : "—");
const monthTh = (p) => (p && /^\d{4}-\d{2}$/.test(p) ? TH_MONTHS[Number(p.slice(5, 7)) - 1] : "");
const dateTh = (d) => (d && /^\d{4}-\d{2}-\d{2}/.test(d) ? `${Number(d.slice(8, 10))} ${TH_MONTHS[Number(d.slice(5, 7)) - 1]} ${Number(d.slice(0, 4)) + 543}` : "—");
const timeTh = (iso) => {
  if (!iso) return "";
  const t = new Date(iso);
  if (isNaN(t)) return "";
  return `${t.getDate()} ${TH_MONTHS[t.getMonth()]} ${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
};
const todayISO = () => {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
};

// Top bar: title, kicker and an optional back target (a hash route).
function header(kick, title, backTo) {
  $("kick").textContent = kick;
  $("title").textContent = title;
  const b = $("back");
  b.hidden = !backTo;
  b.onclick = backTo ? () => go(backTo) : null;
}

// Sticky bottom bar; pass "" to hide it.
function bottom(html) {
  const el = $("bottom");
  el.innerHTML = html;
  el.hidden = !html;
  // The bar floats over the page, so the last card needs room beneath it.
  document.body.classList.toggle("has-bar", !!html);
}

let toastTimer = null;
function toast(msg, isError) {
  const el = $("toast");
  el.textContent = msg;
  el.className = "toast show" + (isError ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = "toast"), 3200);
}

const go = (route) => { location.hash = route; };
const route = () => location.hash.replace(/^#/, "");

// ---------- boot ----------
async function boot() {
  try {
    const cfg = await (await fetch("/api/config")).json();
    if (!cfg.liffId || !window.liff) throw new Error("no-liff");
    await liff.init({ liffId: cfg.liffId });
    if (!liff.isLoggedIn()) return liff.login({ redirectUri: location.href });

    idToken = liff.getIDToken();
    if (!idToken) {
      // LIFF app ต้องเปิด scope "openid" ถึงจะได้ idToken
      return fail("LIFF นี้ยังไม่ได้เปิด scope openid — เพิ่มใน LINE Developers → channel DormPlus LIFF → LIFF → แก้ไข → ติ๊ก openid");
    }

    await checkFriend();

    const me = await api("/api/me");
    MYROLE = me.role || null;
    ROOT = !!me.root;
    // Owners and read-only helpers both use the owner screens; /api/me says which one this is.
    const staff = MYROLE === "owner" || MYROLE === "viewer";
    // LINE opens the LIFF endpoint with our query string wrapped into ?liff.state=… , so a plain
    // `?bind=CODE` scan arrives as `?liff.state=%3Fbind%3DCODE`. Read both, or every QR scan lands
    // on the "ยังไม่ได้ผูกห้อง" screen and the bind never happens.
    const params = new URLSearchParams(location.search);
    const wrapped = params.get("liff.state");
    if (wrapped) {
      const inner = wrapped.includes("?") ? wrapped.slice(wrapped.indexOf("?") + 1) : wrapped;
      for (const [k, v] of new URLSearchParams(inner)) if (!params.has(k)) params.set(k, v);
    }
    const tab = params.get("tab") || "";
    const room = me.room || params.get("room");
    // A receipt link carries ?receipt=<period> (LIFF may drop the #fragment on login); rebuild the route from it.
    const rcpt = /^\d{4}-\d{2}$/.test(params.get("receipt") || "") ? params.get("receipt") : "";
    const tenantHome = () => {
      if (rcpt && !route().startsWith("receipt/")) history.replaceState(null, "", location.pathname + location.search + "#receipt/" + rcpt);
      return startTenant(room);
    };
    const home = () => (staff ? startOwner(rcpt && room ? `receipt/${rcpt}/${encodeURIComponent(room)}` : "home") : room ? tenantHome() : fail("ยังไม่ได้ผูกห้อง — สแกน QR หน้าห้องที่เจ้าของหอให้มา"));

    // Opened from an owner invite QR: redeem the code, then continue as an owner.
    const ownerCode = params.get("owner");
    if (ownerCode) return acceptOwner(ownerCode, me);

    // Opened from a room QR: bind this LINE account to that room, then show its bill.
    const bindCode = params.get("bind");
    if (bindCode) return acceptBind(bindCode, me);

    // Every rich-menu tab now has a screen; a tab we do not know falls back to home.
    const ownerTabs = { meter: "rooms", rooms: "rooms", slips: "review/pending", unpaid: "review/overdue", report: "report" };
    if (ownerTabs[tab]) {
      if (!staff) return notice("เฉพาะเจ้าของหอ", "หน้าจอนี้สำหรับเจ้าของหอ", "ดูบิลของฉัน", home);
      return startOwner(ownerTabs[tab]);
    }
    if (tab === "bill") {
      if (staff) return notice("บิลค่าเช่า", "หน้าจอนี้สำหรับผู้เช่า — เจ้าของหอดูสถานะบิลและสลิปได้ที่หน้าหลัก", "ไปหน้าหลัก", home);
      return room ? startTenant(room) : fail("ยังไม่ได้ผูกห้อง — สแกน QR หน้าห้องที่เจ้าของหอให้มา");
    }

    return home();
  } catch (e) {
    console.error(e);
    fail("เปิดหน้านี้จากปุ่มในแชท LINE เท่านั้น (LIFF)");
  }
}

// A screen for "not built yet" / "wrong role", with one button back to what does work.
function notice(title, message, ctaLabel, cta) {
  header("DormPlus", title);
  bottom("");
  view.innerHTML = `<div class="card"><div class="m">${esc(message)}</div>
    <button class="btn primary" id="cta" style="margin-top:12px">${esc(ctaLabel)}</button></div>`;
  $("cta").onclick = cta;
}

function fail(msg) {
  header("DormPlus", "ใช้งานไม่ได้");
  bottom("");
  view.innerHTML = `<div class="card"><div class="err">${esc(msg)}</div></div>`;
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { ...(opts.body ? { "Content-Type": "application/json" } : {}), Authorization: `Bearer ${idToken}` },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw Object.assign(new Error(data?.error?.message || `HTTP ${res.status}`), {
      status: res.status,
      code: data?.error?.code || null,
      detail: data?.error || {},
    });
  }
  return data;
}

// Downscale in the browser so the photo fits the 4.5MB function limit.
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * scale);
  c.height = Math.round(bmp.height * scale);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.8);
}

// Slip images are private: fetch with the token and keep one object URL per room.
const slipUrls = {};
async function slipUrl(room, advance) {
  // An advance slip can be replaced by the tenant, so it is never cached.
  if (!advance && slipUrls[room]) return slipUrls[room];
  const res = await fetch(`/api/slip-image?room=${encodeURIComponent(room)}${advance ? "&advance=1" : ""}`, {
    headers: { Authorization: `Bearer ${idToken}` },
  });
  if (!res.ok) throw new Error("โหลดสลิปไม่สำเร็จ");
  const url = URL.createObjectURL(await res.blob());
  if (!advance) slipUrls[room] = url;
  return url;
}

// ---------- friend ----------
// LINE does not let an app add itself as a friend: only the user can tap "เพิ่มเพื่อน" in the
// subwindow that requestFriendship() opens. All we can do is ask. getFriendship() is the only way
// to know, and it answers only in a LIFF browser whose Login channel has an OA linked to it —
// anything it cannot answer stays `null` so we say nothing instead of nagging.
let FRIEND = null; // true = friend, false = not a friend, null = cannot tell

async function checkFriend() {
  try {
    FRIEND = (await liff.getFriendship()).friendFlag === true;
  } catch (e) {
    FRIEND = null;
  }
  return FRIEND;
}

function friendCard() {
  if (FRIEND !== false) return "";
  return `<div class="card">
    <div class="m">ยังไม่ได้เพิ่ม DormPlus เป็นเพื่อน — บิลและใบเสร็จจะไม่ถูกส่งเข้าแชท LINE ของคุณ</div>
    <button class="btn primary" id="addFriend" style="margin-top:12px">เพิ่มเพื่อน DormPlus</button>
    <button class="btn sm" id="recheckFriend" style="margin-top:8px">ตรวจอีกครั้ง</button>
  </div>`;
}

// Call after the screen's HTML is in the DOM. `redraw` re-renders whichever screen hosts the card.
function wireFriend(redraw = renderTenant) {
  const add = $("addFriend");
  if (add) add.onclick = async () => {
    try {
      await liff.requestFriendship();
    } catch (e) {
      return toast("กด “เพิ่มเพื่อน” ที่แชท DormPlus ใน LINE", true);
    }
    // The subwindow closed: re-read the flag so the card goes away if they did tap add.
    await checkFriend();
    redraw();
  };
  const re = $("recheckFriend");
  if (re) re.onclick = async () => {
    toast((await checkFriend()) === true ? "เพิ่มเพื่อนแล้ว" : "ยังไม่ได้เพิ่มเป็นเพื่อน", FRIEND !== true);
    redraw();
  };
}

// ---------- tenant ----------
let T = null; // { room, bill, advance } — bill is null while the room has no bill; advance is the slip sent before it

async function startTenant(room) {
  T = { room, bill: null, advance: null };
  window.onhashchange = renderTenant;
  await loadTenant();
}

async function loadTenant() {
  header(`ห้อง ${T.room}`, "ใบแจ้งหนี้");
  view.innerHTML = `<div class="card"><div class="m">กำลังโหลด…</div></div>`;
  bottom("");
  // All unpaid periods past due, counted by the server. It runs beside the bill and fills its card
  // when it arrives, so a slow answer never delays the invoice (or wipes the slip form).
  api("/api/bill?overdue=1").then((o) => {
    T.overdue = o;
    const box = $("overdueBox");
    if (box) box.innerHTML = tenantOverdueCard();
  }).catch(() => {});
  try {
    T.bill = await api(`/api/bill?room=${encodeURIComponent(T.room)}`);
    T.advance = T.bill.advance || null;
  } catch (e) {
    T.bill = null;
    T.advance = null;
    if (e.status === 404) {
      T.advance = e.detail?.advance || null;
      return renderTenant();
    }
    view.innerHTML = `<div class="card"><div class="err">${esc(e.message)}</div></div>`;
    return;
  }
  renderTenant();
}

function renderTenant() {
  if (!T) return;
  // The slip form also serves the advance case: no bill yet, or the latest bill already paid.
  if (route() === "slip") return tenantSlip();
  if (route().startsWith("receipt/")) return receiptScreen(T.room, route().slice(8), "invoice");
  if (!T.bill) return tenantNoBill();
  return tenantInvoice();
}

function advanceCard(adv) {
  if (!adv) return "";
  return `<div class="card"><div class="m">ส่งสลิปโอนก่อนแล้ว ${esc(timeTh(adv.slipAt))} — ระบบจะผูกกับบิลรอบถัดไปเมื่อเจ้าของหอออกบิล</div>
    ${adv.note ? `<div class="hint" style="margin-top:8px">${esc(adv.note)}</div>` : ""}</div>`;
}

function tenantNoBill() {
  header(`ห้อง ${T.room}`, "ใบแจ้งหนี้");
  view.innerHTML = `<div id="overdueBox">${tenantOverdueCard()}</div><div class="card"><div class="m">ยังไม่มีบิลรอบนี้</div>
    <div class="hint" style="margin-top:8px">ถ้าโอนค่าเช่าไว้ก่อนแล้ว แนบสลิปได้เลย ระบบจะผูกกับบิลเมื่อเจ้าของหอออกบิล</div></div>${advanceCard(T.advance)}${friendCard()}`;
  bottom(`<button class="btn primary" id="toSlip">${T.advance ? "ส่งสลิปใหม่แทน" : "โอนก่อน / แนบสลิป"}</button>`);

function statusPill(status) {
  if (status === "void") return `<span class="pill">ยกเลิกแล้ว</span>`;
  if (status === "paid") return `<span class="pill ok">ชำระแล้ว</span>`;
  if (status === "pending") return `<span class="pill warn">รอตรวจสอบ</span>`;
  return `<span class="pill bad">ยังไม่ชำระ</span>`;
}

// What SlipOK said about the photo, if anything. Silence when it was never configured; "ตรวจไม่ได้"
// must never look like "สลิปปลอม".
function verifyLine(v) {
  if (!v || v.reason === "not_configured") return "";
  if (v.ok === true) return `<div class="pill ok" style="margin-top:8px">ตรวจแล้ว${v.amount != null ? ` · ${fmt(v.amount)} บาท` : ""}</div>`;
  if (v.ok === false) return `<div class="pill bad" style="margin-top:8px">${esc(v.reason || "ตรวจไม่ผ่าน")}</div>`;
  return `<div class="pill warn" style="margin-top:8px">${esc(v.reason || "ยังไม่ได้ตรวจ")}</div>`;
}

function tenantOverdueCard() {
  const o = T.overdue;
  if (!o || !o.count) return "";
  return `<div class="card"><div class="m"><b>ค้างชำระ ${o.count} งวด · รวม ${fmt(o.total)} บาท · เกินกำหนดสูงสุด ${o.maxDaysOverdue} วัน</b></div>
    <div class="hint" style="margin-top:8px">งวด ${o.items.map((i) => periodTh(i.period)).join(" · ")}</div></div>`;
}

      <div class="m">ครบกำหนด ${dateTh(b.due)}</div>
      <div class="rows" style="margin-top:12px">

        <div class="row"><span class="m">ค่าน้ำ ${fmt(b.waterUnits)} หน่วย</span><span>${fmt(b.water)}</span></div>

    ${b.status === "paid" || b.status === "void" ? "" : b.pay ? `<div class="card">
      <div class="m">สแกนจ่ายผ่านพร้อมเพย์</div>
      <div class="qr" style="margin-top:12px">${b.pay.qr}</div>
      <div class="m" style="text-align:center;margin-top:8px">${fmt(b.total)} บาท</div>
      <div class="hint" style="text-align:center;margin-top:8px">สแกนด้วยแอปธนาคาร แล้วแนบสลิปด้านล่างให้เจ้าของตรวจ</div>
    </div>` : `<div class="card">
      <div class="qr-ph">QR พร้อมเพย์</div>

function tenantSlip() {
  const b = T.bill;
  const adv = !b || b.status === "paid" || b.status === "void"; // no amount to pay now: the slip waits for the next bill
  header(adv ? `ห้อง ${T.room} · โอนก่อนบิลออก` : `ห้อง ${b.room} · ${fmt(b.total)} บาท`, "แนบสลิป", "invoice");

  view.innerHTML = `
    <label class="pick" for="file" id="pick">
      <b style="font-size:14px">แตะเพื่อเลือกรูปสลิป</b>
      <span class="m">หรือถ่ายรูปจากกล้อง</span>
    </label>
    <input type="file" id="file" accept="image/*">
    ${adv
      ? `<div class="card"><div class="m" id="advNote">ยังไม่มีบิลที่ต้องชำระ — สลิปนี้จะถูกผูกกับบิลรอบถัดไปแทนยอดบิล</div>
      <div id="multi"></div></div>
    <div class="hint">เมื่อเจ้าของหอออกบิล สถานะจะเป็น “รอตรวจสอบ” จนกว่าเจ้าของหอจะยืนยัน</div>`
      : `<div class="card"><div class="row"><span class="m">ยอดในบิล</span><b id="amount">${fmt(b.total)} บาท</b></div>
      <div id="multi"></div></div>
    <div class="hint">สถานะจะเป็น “รอตรวจสอบ” จนกว่าเจ้าของหอจะยืนยัน</div>`}`;

  bottom(`<button class="btn primary" id="send" disabled>ส่งสลิป</button>`);

  // One slip can pay several unpaid months: offer a checkbox per period. In advance mode (no bill,
  // or the newest is paid/void) this list is what lets a tenant still pay an older overdue month.
  // `periods` stays null (the newest bill) unless the choice differs from that.
  let periods = null;
  let hasFile = false;
  const refresh = () => ($("send").disabled = !hasFile || (periods !== null && !periods.size));
  api(`/api/bill?room=${encodeURIComponent(T.room)}&history=1`).then((h) => {
    const open = h.items.filter((i) => i.status === "unpaid" || i.status === "pending");
    if (!open.length || !$("multi")) return;
    if (!adv && open.length < 2) return; // one open bill: the default form already pays it
    if (adv) {
      header(`ห้อง ${T.room} · ค้างชำระ ${open.length} งวด`, "แนบสลิป", "invoice");
      const note = $("advNote");
      if (note) note.textContent = "มีบิลค้างชำระ — เลือกงวดที่สลิปนี้จ่าย";
    }
    const newest = open[0].period; // history is newest first
    periods = new Set([newest]);
    $("multi").innerHTML = `<div class="m" style="margin-top:12px">จ่ายหลายงวดในสลิปเดียว</div>` + open
      .map((i) => `<label class="opt"><input type="checkbox" value="${esc(i.period)}" ${i.period === newest ? "checked" : ""}>
          <span class="grow">${periodTh(i.period)} ${statusPill(i.status)}</span><span>${fmt(i.total)} บาท</span></label>`)
      .join("");
    $("multi").onchange = () => {
      periods = new Set([...$("multi").querySelectorAll("input:checked")].map((x) => x.value));
      const sum = open.filter((i) => periods.has(i.period)).reduce((n, i) => n + Number(i.total || 0), 0);
      const amount = $("amount");
      if (amount) amount.textContent = `${fmt(sum)} บาท`;
      refresh();
    };
  }).catch(() => {}); // the plain single-bill form still works without the list

  $("file").onchange = () => {
    const file = $("file").files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    $("pick").innerHTML = `<img src="${url}" alt="สลิป">`;
    hasFile = true;
    refresh();
  };

  $("send").onclick = async () => {
    const btn = $("send");
    const file = $("file").files[0];
    if (!file) return;
    // More than one ticked, or a single one that is not the newest bill (which is what no `periods` means).
    const chosen = periods && (periods.size > 1 || !periods.has(T.bill?.period)) ? [...periods].sort() : undefined;
    btn.disabled = true;
    btn.textContent = "กำลังส่ง…";
    try {
      const image = await shrink(file);
      const out = await api("/api/slip", { method: "POST", body: JSON.stringify({ room: T.room, image, ...(chosen && { periods: chosen }) }) });
      toast(out.status === "advance" ? "ส่งสลิปแล้ว — จะผูกกับบิลรอบถัดไปเมื่อเจ้าของออกบิล"
        : out.periods?.length > 1 ? `แจ้งชำระ ${out.periods.length} งวดแล้ว — รอเจ้าของหอยืนยัน` : "แจ้งชำระแล้ว — รอเจ้าของหอยืนยัน");
      history.replaceState(null, "", location.pathname + location.search);
      await loadTenant();
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false;
      btn.textContent = "ส่งสลิป";
    }
  };
}

  header(`ห้อง ${room}`, "ใบเสร็จรับเงิน", back);
  bottom("");
  view.innerHTML = `<div class="card"><div class="m">กำลังโหลด…</div></div>`;
  let b;
  try {
    b = await api(`/api/bill?room=${encodeURIComponent(room)}&period=${encodeURIComponent(period)}`);
  } catch (e) {
    view.innerHTML = `<div class="card"><div class="err">${esc(e.message)}</div></div>`;

  // The route may have changed while this was loading (the user went back): do not paint over it.

  view.innerHTML = `
    <div class="receipt">
      <div class="row"><span class="brand">DormPlus</span>${b.status === "void" ? `<span class="pill">ยกเลิกแล้ว</span>` : `<span class="pill ok">ชำระแล้ว</span>`}</div>
      <h2>ใบเสร็จรับเงิน</h2>
      <div class="m">เลขที่ ${esc(b.receiptNo)}</div>
      <div class="rows">
        <div class="row"><span class="m">ห้อง</span><span>${esc(b.room)}</span></div>
        <div class="row"><span class="m">รอบบิล</span><span>${periodTh(b.period)}</span></div>
        <div class="row"><span class="m">ค่าเช่า</span><span>${fmt(b.rent)}</span></div>
        <div class="row"><span class="m">ค่าน้ำ${b.waterUnits != null ? ` ${fmt(b.waterUnits)} หน่วย` : ""}</span><span>${fmt(b.water)}</span></div>
        <div class="row"><span class="m">ค่าไฟ${b.elecUnits != null ? ` ${fmt(b.elecUnits)} หน่วย` : ""}</span><span>${fmt(b.elec)}</span></div>
        <div class="row total"><span>รวมทั้งสิ้น</span><span>${fmt(b.total)} บาท</span></div>

    </div>`;
}

// ---------- owner ----------
// O holds the owner's data; the round's typed units live in a local draft until "ออกบิล".
let O = null;
const DUE_DAY = 16;
const nextPeriod = (p) => {
  if (!p || !/^\d{4}-\d{2}$/.test(p)) return "";
  const y = Number(p.slice(0, 4));
  const m = Number(p.slice(5, 7));
  return m === 12 ? `${y + 1}-01` : `${y}-${String(m + 1).padStart(2, "0")}`;
};
const floorOf = (room) => (room.length > 2 ? room.slice(0, -2) : room);

// The round in progress: the newest billed period while some rooms still carry an older
// bill, otherwise the month after it. Rooms that never had a bill don't hold a round open.
function currentRound(rooms, fallback) {
  const periods = rooms.map((r) => r.bill?.period).filter(Boolean);
  const newest = periods.slice().sort().pop();
  if (!newest) return fallback || "";
  return periods.some((p) => p < newest) ? newest : nextPeriod(newest);
}

const draftKey = () => `dp_draft:${O.period}`;
function loadDraft() {
  try { return JSON.parse(localStorage.getItem(draftKey()) || "{}") || {}; } catch { return {}; }
}
function saveDraft() {
  try { localStorage.setItem(draftKey(), JSON.stringify(O.draft)); } catch {}
}

// A void bill does not count as billed: the room can be metered and issued again (rev + 1).
const billedNow = (r) => r.bill && r.bill.period === O.period && r.bill.status !== "void";
const isRead = (r) => billedNow(r) || !!O.draft[r.room];
const lastUnits = (r) => ({
  water: r.bill?.waterUnits ?? r.meter?.water ?? null,
  elec: r.bill?.elecUnits ?? r.meter?.elec ?? null,
});
const isOverdue = (b) => b && b.status === "unpaid" && b.due && b.due < todayISO();
// The dorm's current month (Bangkok), for the income report: the server groups by the same clock.
const bangkokMonthNow = () => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Bangkok" }).format(new Date()).slice(0, 7);
// A Bangkok calendar date from an ISO time: the UTC slice dateTh() takes would show the previous day for 00:00-06:59 Bangkok.
const bangkokDateTh = (iso) => (isNaN(new Date(iso)) ? "—" : dateTh(new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Bangkok" }).format(new Date(iso))));
// Days overdue and the per-room totals come from /api/bill?overdue=1 (server date), not this device's clock.
async function loadOverdue() {
  try {
    O.overdueData = await api("/api/bill?overdue=1");
    O.overdueFailed = false;
  } catch (e) {
    O.overdueFailed = true;
  }
}

// ค้างกี่งวด · รวมเท่าไร · เลยกี่วัน for one room of the server's overdue answer.
const overdueRoomLine = (r) => `ค้าง ${r.count} งวด · รวม ${fmt(r.total)} บาท · เลย ${r.maxDaysOverdue} วัน`;

function totalFor(room, units) {
  const c = O.cfg[room] || {};
  const water = Math.round(Number(units.water || 0) * Number(c.waterRate || 0));
  const elec = Math.round(Number(units.elec || 0) * Number(c.elecRate || 0));
  return { water, elec, rent: Number(c.rent || 0), total: Number(c.rent || 0) + water + elec };
}

function nextTodo(after) {
  const list = O.rooms;
  const start = after ? list.findIndex((r) => r.room === after) + 1 : 0;
  const order = [...list.slice(start), ...list.slice(0, start)];
  return order.find((r) => !isRead(r) && !O.skipped.has(r.room) && r.room !== after) || null;
}

async function startOwner(initial) {
  O = { rooms: [], cfg: {}, period: "", due: "", draft: {}, skipped: new Set(), filter: "all", reviewTab: "pending" };
  window.onhashchange = renderOwner;
  if (route() !== initial) history.replaceState(null, "", "#" + initial);
  await loadOwner();
}

async function loadOwner() {
  header("DormPlus · เจ้าของหอ", "กำลังโหลด…");
  try {
    const data = await api("/api/rooms");
    O.overdueData = null; // the bills may have changed; the overdue screens fetch it again
    O.rooms = data.rooms;
    O.dormName = data.dorm || null;
    O.cfg = Object.fromEntries(data.rooms.map((r) => [r.room, r.config]));
    if (!O.period) {
      O.period = currentRound(data.rooms, data.period);
      O.due = O.period ? `${O.period}-${String(DUE_DAY).padStart(2, "0")}` : "";
    }
    O.draft = loadDraft();
  } catch (e) {
    header("DormPlus · เจ้าของหอ", "ใช้งานไม่ได้");
    bottom("");
    view.innerHTML = `<div class="card"><div class="err">ต่อ API ไม่ได้: ${esc(e.message)}</div></div>`;
    return;
  }
  renderOwner();
}

function renderOwner() {
  if (!O) return;
  const r = route();
  view.oninput = null;
  window.scrollTo(0, 0);
  if (r === "rooms") return ownerRooms();
  if (r.startsWith("entry/")) return ownerEntry(decodeURIComponent(r.slice(6)));
  if (r.startsWith("qr/")) {
    const [, room, kind] = r.split("/");
    return ownerQr(decodeURIComponent(room), kind === "add");
  }
  if (r.startsWith("receipt/")) {
    const [, period, room = ""] = r.split("/");
    return receiptScreen(decodeURIComponent(room), period, `entry/${room}`);
  }
  if (r === "bill") return ownerBill();
  if (r === "report") return ownerReport();
  if (r === "settings") return ownerSettings();
  if (r === "owners") return ownerInvite();
  if (r.startsWith("review")) return ownerReview(r.split("/")[1] || O.reviewTab);
  return ownerHome();
}

  const total = O.rooms.length;

  const bills = O.rooms.map((r) => r.bill).filter(Boolean);
  const unpaid = bills.filter((b) => b.status === "unpaid").length;
  const pending = bills.filter((b) => b.status === "pending").length;
  const overdue = bills.filter(isOverdue).length;

  view.innerHTML = `
    <div id="refundBox"></div>
    ${MYROLE === "viewer" ? `<div class="card"><div class="m">บัญชีนี้เป็น <b>ผู้ช่วย (ดูอย่างเดียว)</b> — ดูบิล/สลิป/รายงานได้ แต่ออกบิลหรือยืนยันการชำระไม่ได้</div></div>` : ""}
    <div class="card">
      <div class="m">จดมิเตอร์แล้ว</div>
      <div class="big">${read} / ${total} ห้อง</div>
      <div class="progress"><i style="width:${total ? (read / total) * 100 : 0}%"></i></div>
    </div>
    <div class="stats">
      <button class="card" data-go="review/overdue"><div class="m">ยังไม่จ่าย</div><div class="big">${unpaid}</div></button>
      <button class="card" data-go="review/pending"><div class="m">รอตรวจสลิป</div><div class="big">${pending}</div></button>
      <button class="card" data-go="review/overdue"><div class="m">ค้างเกินกำหนด</div><div class="big">${overdue}</div></button>
    </div>
    <div class="section">ทำต่อ</div>
    <div class="stack">
      <button class="btn primary" data-go="rooms">จดมิเตอร์</button>
      ${MYROLE === "viewer" ? "" : `<button class="btn" data-go="bill">ออกบิลทั้งหอ</button>`}
      <button class="btn" data-go="review/pending">สลิปรอตรวจ (${pending})</button>
      <button class="btn" data-go="report">รายงานรายรับ</button>
      ${MYROLE === "viewer" ? "" : `<button class="btn" data-go="owners">เจ้าของและผู้ช่วย</button>`}
      <button class="btn" id="settings">ตั้งค่าหอ</button>
    </div>`;

  view.querySelectorAll("[data-go]").forEach((el) => (el.onclick = () => go(el.dataset.go)));
  $("settings").onclick = () => go("settings");

  // Refunds still owed: cancelled paid bills ("void") and overpaid paid bills ("overpaid"). Loaded after the screen is up so home is not
  // slowed down; a failure just leaves the notice out.
  api("/api/bill?voided=1&refunds=1").then((out) => {
    const box = $("refundBox");
    if (!box || (route() !== "" && route() !== "home") || !out.count) return;
    box.innerHTML = `<div class="card">
      <div class="m">ต้องคืนเงินผู้เช่า ${out.count} รายการ · รวม ${fmt(out.total)} บาท</div>
      <div class="rows" style="margin-top:8px">${out.items
        .map((v, i) => `<div class="row"><button class="btn sm" data-go="entry/${encodeURIComponent(v.room)}">ห้อง ${esc(v.room)} · ${periodTh(v.period)} · ${v.kind === "overpaid" ? "โอนเกิน" : "ยกเลิกบิล"} · ${fmt(v.refundDue)} บาท</button>
          ${MYROLE !== "viewer" ? `<button class="btn sm" data-refund="${i}">คืนเงินแล้ว</button>` : ""}</div>`)
        .join("")}</div></div>`;
    box.querySelectorAll("[data-go]").forEach((el) => (el.onclick = () => go(el.dataset.go)));
    // Works after a re-issue too: a void comes from the void archive, not from the latest bill.
    box.querySelectorAll("[data-refund]").forEach((el) => {
      const v = out.items[Number(el.dataset.refund)];
      el.onclick = () => markRefunded(v.room, v, el, v.kind === "overpaid" ? "overpaid" : "void");
    });
  }).catch(() => {});
}

      <div class="field"><label for="sWater">ค่าน้ำ (บาท/หน่วย)</label>
        <div class="in"><input id="sWater" type="number" min="0" step="1" inputmode="numeric" value="${d.waterRate}"></div></div>
      <div class="field"><label for="sElec">ค่าไฟ (บาท/หน่วย)</label>
        <div class="in"><input id="sElec" type="number" min="0" step="1" inputmode="numeric" value="${d.elecRate}"></div></div>
    </div>
    <div class="card">
      <div class="field"><label for="sDue">วันครบกำหนด (วันที่ของเดือนที่ออกบิล)</label>
        <div class="in"><input id="sDue" type="number" min="1" max="28" step="1" inputmode="numeric" value="${dorm.dueDay || ""}" placeholder="เช่น 5"></div>
      </div>
      <div class="hint">เว้นว่าง = ไม่กำหนดวันครบกำหนด (บิลจะไม่มีกำหนด)</div>
    </div>
    <div class="card">
      <div class="field"><label for="sPay">พร้อมเพย์ (เบอร์มือถือ 10 หลัก / บัตรประชาชน 13 หลัก / e-Wallet 15 หลัก)</label>
        <input id="sPay" inputmode="numeric" maxlength="20" value="${esc(dorm.promptpay || "")}" placeholder="เช่น 0812345678">
      </div>
      <div class="hint">เลขบัญชีธนาคารใช้ไม่ได้ · ใส่แล้วบิลที่ยังไม่ชำระจะมี QR ตามยอดให้สแกนทันที · เว้นว่าง = ไม่แสดง QR</div>
      <div class="err" id="dormErr" style="margin-top:8px" hidden></div>

    <div class="card">
      <button class="btn" id="saveDorm">บันทึก</button>
      <div class="hint" style="margin-top:8px">ค่าเช่า/ค่าน้ำ/ค่าไฟ ใช้กับบิลที่ออกหลังจากนี้ · QR พร้อมเพย์ขึ้นกับบิลที่ยังไม่ชำระทันที</div>

    const body = { dorm: { name: $("sName").value.trim() || null, rent: num("sRent"), waterRate: num("sWater"), elecRate: num("sElec"), dueDay: num("sDue"), promptpay: $("sPay").value.trim() || null } };

// Money view: what was billed, what came in, what is still out there.
function ownerReport() {
  header("รายงานรายรับ", "สรุปยอด", "home");
  bottom("");
  const bills = O.rooms.filter((r) => r.bill && r.bill.status !== "void").map((r) => r.bill); // void is not money owed
  if (!bills.length) {
    view.innerHTML = `<div class="card empty m">ยังไม่มีบิลในระบบ — จดมิเตอร์แล้วออกบิลก่อน</div>`;
    return;
  }

  // Report on the newest period that actually has bills, not on the round being prepared.
  const period = bills.map((b) => b.period).sort().pop();
  const of = bills.filter((b) => b.period === period);
  const sum = (list) => list.reduce((n, b) => n + Number(b.total || 0), 0);
  const paid = of.filter((b) => b.status === "paid");
  const pending = of.filter((b) => b.status === "pending");
  const unpaid = of.filter((b) => b.status === "unpaid");
  const billed = sum(of);
  const collected = sum(paid);
  const pct = billed ? Math.round((collected / billed) * 100) : 0;

  const money = (n) => fmt(n) + " บาท";
  const line = (label, value, cls = "") =>
    `<div class="row"><span class="m">${label}</span><span class="${cls}">${money(value)}</span></div>`;

  // Received money and the overdue list come from the server (Bangkok date, all periods), so they
  // are filled in once those answers arrive; the per-period split above needs no extra reads.
  const month = bangkokMonthNow();
  view.innerHTML = `
    <div class="card">
      <div class="m">รอบบิล ${periodTh(period)} · ${of.length} ห้อง</div>
      <div class="big">${money(billed)}</div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="row"><span class="m">เก็บได้ ${money(collected)}</span><span class="m">${pct}%</span></div>
    </div>
    <div class="card rows">
      ${line(`ชำระแล้ว (${paid.length} ห้อง)`, sum(paid))}
      ${line(`รอตรวจสลิป (${pending.length} ห้อง)`, sum(pending))}
      ${line(`ยังไม่ชำระ (${unpaid.length} ห้อง)`, sum(unpaid))}
      <div id="overdueRow"></div>
    </div>
    <div class="card" id="incomeCard"><div class="m">รับเงินเดือนนี้ (ตามวันที่ชำระ)</div><div class="hint" style="margin-top:8px">กำลังโหลด…</div></div>
    <div id="worstBox"></div>
    <div class="hint">ยอดรอบบิลนับจากบิลล่าสุดของแต่ละห้อง · "รับเงินเดือนนี้" นับตามวันที่เจ้าของยืนยันการชำระ (เวลาไทย) ไม่ว่าเป็นบิลของรอบไหน · รายการค้างนับจากบิลย้อนหลังไม่เกิน 13 งวด</div>`;

  api(`/api/bill?income=${month}`).then((inc) => {
    if (route() !== "report") return;
    $("incomeCard").innerHTML = `<div class="m">รับเงินเดือนนี้ (ตามวันที่ชำระ) · ${periodTh(inc.month)}</div>
      <div class="big">${money(inc.total)}</div>
      <div class="m">${fmt(inc.count)} รายการ</div>`;
  }).catch((e) => {
    if (route() === "report") $("incomeCard").innerHTML = `<div class="m">รับเงินเดือนนี้ (ตามวันที่ชำระ)</div><div class="err" style="margin-top:8px">โหลดไม่สำเร็จ: ${esc(e.message)}</div>`;
  });

  loadOverdue().then(() => {
    const od = O.overdueData;
    if (route() !== "report" || !od || !od.rooms.length) return;
    $("overdueRow").innerHTML = `<div class="row"><span class="m">ค้างเกินกำหนด ${od.rooms.length} ห้อง (${od.count} งวด)</span><span class="pill bad">${money(od.total)}</span></div>`;
    $("worstBox").innerHTML = `<div class="section">ค้างนานที่สุด</div><div class="stack">${od.rooms
      .slice(0, 5)
      .map((r) => `<button class="roomcard" data-room="${esc(r.room)}">
          <span><b>ห้อง ${esc(r.room)}</b><div class="m">${overdueRoomLine(r)}</div></span>
          <span class="pill bad">เลย ${r.maxDaysOverdue} วัน</span></button>`)
      .join("")}</div>`;
    view.querySelectorAll("[data-room]").forEach((el) => {
      el.onclick = () => go(`review/overdue`);
    });
  });
}

// Owner-only: who has owner/helper access, plus a one-time code + QR to add someone.
// Only the first owner (ROOT) can add another full owner or remove anyone.
function ownerInvite() {
  if (MYROLE === "viewer") {
    return notice("เฉพาะเจ้าของหอ", "บัญชีผู้ช่วยจัดการสิทธิ์ไม่ได้", "ไปหน้าหลัก", () => go("home"));
  }
  header("เจ้าของและผู้ช่วย", "สิทธิ์", "home");
  bottom("");
  const ownerLabel = "เจ้าของหอ (แก้ไข/ออกบิลได้)";
  const viewerLabel = "ผู้ช่วย (ดูอย่างเดียว)";
  view.innerHTML = `
    <div class="section">คนที่เข้าหน้าเจ้าของได้</div>
    <div id="members" class="card"><div class="m">กำลังโหลด…</div></div>
    <div class="section">เพิ่มคน</div>
    <div class="card">
      <div class="m">สร้างรหัสให้คนที่สแกนในแอป LINE — ใช้ได้ครั้งเดียว หมดอายุใน 10 นาที</div>
      ${ROOT ? `<button class="btn primary" id="mk" style="margin-top:12px">${ownerLabel}</button>` : ""}
      <button class="btn${ROOT ? "" : " primary"}" id="mkViewer" style="margin-top:${ROOT ? 8 : 12}px">${viewerLabel}</button>
      ${ROOT ? "" : `<div class="m" style="margin-top:8px">เพิ่มเจ้าของหอ หรือถอนสิทธิ์ใคร ต้องให้เจ้าของหอคนแรกทำ</div>`}
    </div>
    <div id="out"></div>`;

  const roleTh = (m) => (m.root ? "เจ้าของหอคนแรก" : m.role === "viewer" ? "ผู้ช่วย (ดูอย่างเดียว)" : "เจ้าของหอ");
  const loadMembers = async () => {
    try {
      const r = await api("/api/owner");
      $("members").className = "card rows";
      $("members").innerHTML = r.members.length
        ? r.members
            .map(
              (m, i) => `<div class="row">
                <span><b>${esc(m.name || "(ไม่ทราบชื่อ)")}</b>${m.you ? ` <span class="m">· คุณ</span>` : ""}
                  <div class="m">${roleTh(m)}${m.addedAt ? ` · เพิ่มเมื่อ ${timeTh(m.addedAt)}` : ""}</div></span>
                ${r.root && !m.root && m.userId ? `<button class="btn" data-revoke="${i}" style="width:auto;padding:6px 12px">ถอนสิทธิ์</button>` : ""}
              </div>`
            )
            .join("")
        : `<div class="m">ยังไม่มีใคร</div>`;
      view.querySelectorAll("[data-revoke]").forEach((el) => {
        const m = r.members[Number(el.dataset.revoke)];
        el.onclick = async () => {
          if (!confirm(`ถอนสิทธิ์ ${m.name || "บัญชีนี้"} (${roleTh(m)})? เขาจะเข้าหน้าเจ้าของไม่ได้ทันที และรหัสเชิญที่เขาสร้างไว้จะใช้ไม่ได้`)) return;
          el.disabled = true;
          try {
            await api("/api/owner", { method: "DELETE", body: JSON.stringify({ userId: m.userId }) });
            toast("ถอนสิทธิ์แล้ว");
            loadMembers();
          } catch (e) {
            toast(e.message, true);
            el.disabled = false;
          }
        };
      });
    } catch (e) {
      $("members").innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }
  };
  loadMembers();

  const mint = async (role) => {
    const btn = role === "viewer" ? $("mkViewer") : $("mk");
    btn.disabled = true;
    btn.textContent = "กำลังสร้าง…";
    try {
      const r = await api("/api/owner", { method: "POST", body: JSON.stringify({ role }) });
      $("out").innerHTML = `
        <div class="card">
          <div class="m">ให้เขาสแกน QR นี้ในแอป LINE (หรือส่งลิงก์ให้เปิดใน LINE)</div>
          ${r.qr ? `<div class="qr">${r.qr}</div>` : ""}
          <div class="row" style="margin-top:12px"><span class="m">สิทธิ์</span><b>${r.role === "viewer" ? viewerLabel : "เจ้าของหอ"}</b></div>
          <div class="row" style="margin-top:8px"><span class="m">รหัส</span><b style="font-size:18px;letter-spacing:2px">${esc(r.code)}</b></div>
          ${r.url ? `<div class="m" style="margin-top:8px;word-break:break-all">${esc(r.url)}</div>` : `<div class="m warnText" style="margin-top:8px">ยังไม่ได้ตั้ง LIFF_ID — ส่งรหัสให้เขาพิมพ์เองไม่ได้</div>`}
          <div class="m" style="margin-top:8px">หมดอายุ ${timeTh(r.expiresAt)}</div>
        </div>`;
      $("out").scrollIntoView({ behavior: "smooth" });
    } catch (e) {
      toast(e.message, true);
    }
    btn.disabled = false;
    btn.textContent = role === "viewer" ? viewerLabel : ownerLabel;
  };

  if (ROOT) $("mk").onclick = () => mint("owner");
  $("mkViewer").onclick = () => mint("viewer");
}

// Someone opened the QR link: redeem the code, then land on the owner home.
async function acceptOwner(code, me) {
  header("DormPlus", "กำลังยืนยันสิทธิ์");
  bottom("");
  view.innerHTML = `<div class="card"><div class="m">กำลังตรวจรหัส…</div></div>`;
  const wasStaff = me.role === "owner" || me.role === "viewer";
  try {
    await api("/api/owner", { method: "POST", body: JSON.stringify({ code }) });
    history.replaceState(null, "", location.pathname);
    const fresh = await api("/api/me");
    // A helper code makes a viewer, not an owner: both open the owner screens.
    if (fresh.role !== "owner" && fresh.role !== "viewer") throw new Error("ยังไม่ได้สิทธิ์ — ขอรหัสใหม่จากเจ้าของหอ");
    MYROLE = fresh.role;
    ROOT = !!fresh.root;
    toast(MYROLE === "viewer" ? "เพิ่มคุณเป็นผู้ช่วย (ดูอย่างเดียว) แล้ว" : "เพิ่มคุณเป็นเจ้าของหอแล้ว");
    return startOwner("home");
  } catch (e) {
    return notice(
      "ยืนยันไม่สำเร็จ",
      e.message,
      wasStaff ? "ไปหน้าหลัก" : "ดูบิลของฉัน",
      () => (wasStaff ? startOwner("home") : me.room ? startTenant(me.room) : fail("ยังไม่ได้ผูกห้อง"))
    );
  }
}

// Owner-only: the QR printed for a room's door, so a tenant binds by scanning it.
function ownerQr(room, addMode = false) {
  header(`ห้อง ${room}`, addMode ? "เพิ่มผู้เช่า (สมาชิก)" : "QR ผู้เช่า", "rooms");
  bottom("");
  view.innerHTML = `<div class="card"><div class="m">กำลังสร้าง QR…</div></div>`;

  const show = (r) => {
    view.innerHTML = `
      <div class="card">
        <div class="m">${addMode
          ? "ให้ผู้เช่าคนที่สองของห้องสแกน — เพิ่มเป็นสมาชิกโดยไม่เปลี่ยนผู้เช่าหลัก"
          : "ให้ผู้เช่าสแกนในแอป LINE — ผูกกับห้องนี้ทันที (ไม่ต้องพิมพ์เลขห้อง)"}</div>
        ${r.qr ? `<div class="qr">${r.qr}</div>` : `<div class="m warnText">ยังไม่ได้ตั้ง LIFF_ID — สร้าง QR ไม่ได้</div>`}
        <div class="row" style="margin-top:12px"><span class="m">รหัส${addMode ? "เชิญ" : "ห้อง"}</span><b style="letter-spacing:2px">${esc(r.code)}</b></div>
        ${r.url ? `<div class="m" style="margin-top:8px;word-break:break-all">${esc(r.url)}</div>` : ""}
      </div>
      <div class="card">
        ${addMode
          ? `<div class="m">QR นี้ <b>เพิ่มสมาชิก</b> เท่านั้น (ใช้ได้หลายคนจนกว่าจะยกเลิก) · สมาชิกเห็นบิลและแนบสลิปได้ แต่การ์ดบิล/ข้อความทวง/ใบเสร็จยังส่งหาผู้เช่าหลักคนเดียว · ออก QR ใหม่อีกครั้ง = รหัสเก่าใช้ไม่ได้</div>`
          : `<div class="m">ปริ้นแปะหน้าห้องได้เลย · QR นี้ผูกได้เฉพาะตอนที่ห้องยังไม่มีผู้เช่าผูกอยู่ คนที่ถ่ายรูปไปจึงแย่งห้องที่มีคนอยู่แล้วไม่ได้</div>
        ${MYROLE === "viewer" ? "" : `<button class="btn" id="rotate" style="margin-top:12px">เปลี่ยนผู้เช่า (ถอดคนเดิม + สร้าง QR ใหม่)</button>`}`}
      </div>`;

    if (!addMode && (!MYROLE || MYROLE === "owner")) $("rotate").onclick = async () => {
      if (!confirm(`เปลี่ยนผู้เช่าห้อง ${room}? ผู้เช่าที่ผูกอยู่จะถูกถอดออก และ QR ที่แปะอยู่จะใช้ไม่ได้ทันที`)) return;
      try {
        const r = await api(`/api/qr?room=${encodeURIComponent(room)}`, { method: "POST" });
        show(r);
        toast((r.unbound ? "ถอดผู้เช่าเดิมและสร้าง QR ใหม่แล้ว" : "สร้าง QR ใหม่แล้ว") +
          (r.prepayArchived ? " · ผู้เช่าเดิมมีสลิปโอนล่วงหน้าค้าง — ตรวจสอบ/คืนเงินเอง" : ""));
      } catch (e) {
        toast(e.message, true);
      }
    };
  };

  api(`/api/qr?room=${encodeURIComponent(room)}${addMode ? "&mode=add" : ""}`, addMode ? { method: "POST" } : undefined)
    .then(show)
    .catch((e) => {
      view.innerHTML = `<div class="card"><div class="err">${esc(e.message)}</div></div>`;
    });
}

// A tenant opened the room QR: bind, then continue as that room's tenant.
// Someone who already has a room is asked before being moved, so a forwarded link cannot move them.
async function acceptBind(code, me) {
  header("DormPlus", "กำลังผูกห้อง");
  bottom("");
  view.innerHTML = `<div class="card"><div class="m">กำลังตรวจ QR…</div></div>`;
  const staff = me.role === "owner" || me.role === "viewer";
  const bind = (confirmMove) => api("/api/qr", { method: "POST", body: JSON.stringify({ code, confirmMove }) });
  try {
    let r;
    try {
      r = await bind(false);
    } catch (e) {
      if (e.code !== "MOVE_CONFIRM_REQUIRED") throw e;
      const { current, room } = e.detail;
      if (!confirm(`บัญชีนี้ผูกกับห้อง ${current} อยู่\nย้ายไปห้อง ${room}? ห้อง ${current} จะไม่ส่งบิลมาที่บัญชีนี้อีก`)) {
        history.replaceState(null, "", location.pathname);
        return startTenant(current);
      }
      r = await bind(true);
    }
    history.replaceState(null, "", location.pathname);
    const msg = r.previous && r.previous !== r.room ? `ย้ายจากห้อง ${r.previous} มาห้อง ${r.room} แล้ว` : `ผูกกับห้อง ${r.room} แล้ว`;
    // LINE will not add the OA for us, so ask on a screen of its own the moment the bind lands.
    await checkFriend();
    if (FRIEND === false) return bindDone(r.room, msg);
    toast(msg);
    return startTenant(r.room);
  } catch (e) {
    return notice("ผูกไม่สำเร็จ", e.message, staff ? "ไปหน้าหลัก" : "ลองใหม่", () =>
      staff ? startOwner("home") : fail("สแกน QR หน้าห้องอีกครั้ง")
    );
  }
}

// The bind worked but this account is not a friend of the OA: bills and receipts would never arrive
// in chat, so the add-friend button gets its own screen while the tenant is still paying attention.
function bindDone(room, msg) {
  header(`ห้อง ${room}`, "ผูกห้องแล้ว");
  view.innerHTML = `<div class="card"><div class="m">${esc(msg)}</div></div>${friendCard()}`;
  bottom(`<button class="btn primary" id="toBill">ไปหน้าบิลของฉัน</button>`);
  $("toBill").onclick = () => startTenant(room);
  wireFriend(() => bindDone(room, msg));
}

function ownerRooms() {
  header(`รอบบิล ${periodTh(O.period)}`, "จดมิเตอร์", "home");
  const all = O.rooms;
  const todo = all.filter((r) => !isRead(r));
  const done = all.filter(isRead);
  const shown = O.filter === "todo" ? todo : O.filter === "done" ? done : all;
  const next = nextTodo();

  const floors = {};
  shown.forEach((r) => (floors[floorOf(r.room)] ||= []).push(r));

  const card = (r) => {
    let pill;
    if (billedNow(r)) pill = r.bill.status === "paid" ? `<span class="pill ok">ชำระแล้ว</span>` : `<span class="pill">ออกบิลแล้ว</span>`;
    else if (O.draft[r.room]) pill = `<span class="pill ok">จดแล้ว</span>`;
    else pill = `<span class="pill todo">ยังไม่จด</span>`;
    if (r.bill?.period === O.period && r.bill.status === "void") pill = `<span class="pill">ยกเลิกแล้ว</span> ${pill}`;
    if (r.advance) pill = `<span class="pill warn">โอนล่วงหน้า</span> ${pill}`;
    const isNext = next && next.room === r.room;
    const who = r.members > 1 ? `${r.tenantName || "ผู้เช่า"} +${r.members - 1}` : r.tenantName || "";
    const sub = isNext ? "ห้องถัดไป" : who || ((r.linked ?? r.tenant) ? "ผู้เช่า (ไม่ทราบชื่อ)" : "ยังไม่ผูก LINE");
    return `<button class="roomcard${isNext ? " next" : ""}" data-room="${esc(r.room)}">
      <span><b>ห้อง ${esc(r.room)}</b>${sub ? `<div class="m">${esc(sub)}</div>` : ""}</span>${pill}</button>`;
  };

  view.innerHTML = `
    <div class="chips">
      <button class="chip ${O.filter === "all" ? "on" : ""}" data-f="all">ทั้งหมด ${all.length}</button>
      <button class="chip ${O.filter === "todo" ? "on" : ""}" data-f="todo">ยังไม่จด ${todo.length}</button>
      <button class="chip ${O.filter === "done" ? "on" : ""}" data-f="done">จดแล้ว ${done.length}</button>
    </div>
    ${Object.keys(floors).length ? Object.entries(floors).map(([f, list]) =>
      `<div class="section">ชั้น ${esc(f)}</div><div class="stack">${list.map(card).join("")}</div>`).join("")
      : `<div class="card empty m">ไม่มีห้องในหมวดนี้</div>`}`;

  bottom(next
    ? `<button class="btn primary" id="startNext">เริ่มจดห้อง ${esc(next.room)}</button>`
    : `<button class="btn primary" id="toBill">จดครบแล้ว · ไปออกบิล</button>`);
  if (next) $("startNext").onclick = () => go(`entry/${encodeURIComponent(next.room)}`);
  else $("toBill").onclick = () => go("bill");

  view.querySelectorAll("[data-f]").forEach((el) => (el.onclick = () => { O.filter = el.dataset.f; ownerRooms(); }));
  view.querySelectorAll("[data-room]").forEach((el) => (el.onclick = () => go(`entry/${encodeURIComponent(el.dataset.room)}`)));
}

    <div class="card rows" id="calc"></div>

    ${r.bill ? `<div class="card">
      <div class="row"><span class="m">บิลล่าสุด ${periodTh(r.bill.period)}</span>${statusPill(r.bill.status)}</div>
      <div class="big" style="margin-top:4px">${fmt(r.bill.total)} <span class="unit">บาท</span></div>

  if ($("overpaidBtn")) $("overpaidBtn").onclick = () => markRefunded(r.room, r.bill, $("overpaidBtn"), "overpaid");

  if ($("endTenantBtn")) $("endTenantBtn").onclick = () => removeTenant(r.room);

  const units = () => ({ water: Number($("inW").value || 0), elec: Number($("inE").value || 0) });
  const calc = () => {
    const u = units();
    const t = totalFor(r.room, u);
    $("calc").innerHTML = `
      <div class="row"><span class="m">น้ำ ${fmt(u.water)} หน่วย × ${fmt(c.waterRate)}</span><span>${fmt(t.water)} บาท</span></div>
      <div class="row"><span class="m">ไฟ ${fmt(u.elec)} หน่วย × ${fmt(c.elecRate)}</span><span>${fmt(t.elec)} บาท</span></div>
      <div class="row"><span class="m">ค่าเช่า</span><span>${fmt(t.rent)} บาท</span></div>
      <div class="row total"><span>รวม</span><span>${fmt(t.total)} บาท</span></div>`;

    if (u.water < 0 || u.elec < 0) warn.push("หน่วยติดลบไม่ได้");

    if (last.water > 0 && u.water > 0 && u.water < last.water) warn.push(`น้ำน้อยกว่าเดือนก่อน (${fmt(last.water)} หน่วย)`);

    return warn;
  };
  if (!locked) view.oninput = calc;

  const next = nextTodo(r.room);

      ? `<button class="btn primary" id="toNext">ไปห้อง ${esc(next.room)}</button>`

  bottom(`

    if ($("inW").value.trim() === "" || $("inE").value.trim() === "") return toast("กรอกหน่วยน้ำและไฟให้ครบ", true);
    const u = units();
    if (u.water < 0 || u.elec < 0) return toast("หน่วยติดลบไม่ได้", true);
    if (!Number.isInteger(u.water) || !Number.isInteger(u.elec)) return toast("หน่วยต้องเป็นจำนวนเต็ม", true);
    O.draft[r.room] = u;
    O.skipped.delete(r.room);
    saveDraft();
    const n = nextTodo(r.room);
    toast(`บันทึกห้อง ${r.room} แล้ว`);
    go(n ? `entry/${encodeURIComponent(n.room)}` : "bill");
  };
  $("skip").onclick = () => {
    O.skipped.add(r.room);
    if (O.draft[r.room]) { delete O.draft[r.room]; saveDraft(); }
    const n = nextTodo(r.room);
    go(n ? `entry/${encodeURIComponent(n.room)}` : "rooms");
  };
}

function ownerBill() {
  header(`รอบบิล ${periodTh(O.period)}`, "ออกบิลทั้งหอ", "home");
  const open = O.rooms.filter((r) => !billedNow(r));
  const ready = open.filter((r) => O.draft[r.room]);
  const linked = ready.filter((r) => r.linked ?? r.tenant).length;
  const missing = open.length - ready.length;
  const sum = ready.reduce((s, r) => s + totalFor(r.room, O.draft[r.room]).total, 0);
  const billed = O.rooms.length - open.length;

  view.innerHTML = `
    <div class="card rows">
      <div class="row"><span class="m">จดมิเตอร์แล้ว</span><span>${ready.length} / ${open.length} ห้อง</span></div>

      <div class="row"><span class="m">ครบกำหนดชำระ</span><span>${dateTh(O.due)}</span></div>
      <div class="row total"><span>ยอดรวมทั้งหอ</span><span>${fmt(sum)} บาท</span></div>
    </div>
    <div class="card">
      <div class="row"><span class="m">รอบบิล / วันครบกำหนด</span><button class="btn sm" id="editRound">แก้ไข</button></div>
      <div class="stack" id="roundInputs" style="display:none;margin-top:12px">
        <div class="field"><label for="period">รอบบิล (ปี ค.ศ.-เดือน)</label><div class="in"><input id="period" type="text" value="${esc(O.period)}" placeholder="2026-12"></div></div>
        <div class="field"><label for="due">ครบกำหนด (ปี ค.ศ.-เดือน-วัน)</label><div class="in"><input id="due" type="text" value="${esc(O.due)}" placeholder="2026-12-16"></div></div>
        <button class="btn" id="applyRound">ใช้ค่านี้</button>
      </div>
    </div>
    ${missing ? `<div class="hint warnText">ยังไม่ได้จดอีก ${missing} ห้อง — ห้องที่ไม่จดจะไม่ถูกออกบิลรอบนี้</div>` : ""}
    ${linked < ready.length ? `<div class="hint">${ready.length - linked} ห้องยังไม่ผูก LINE — บิลจะถูกสร้างแต่ไม่มีการ์ดส่งไป</div>` : ""}`;

  $("editRound").onclick = () => {
    const box = $("roundInputs");
    box.style.display = box.style.display === "none" ? "flex" : "none";
  };
  $("applyRound").onclick = () => {
    const p = $("period").value.trim();
    const d = $("due").value.trim();
    if (!/^\d{4}-\d{2}$/.test(p)) return toast("รอบบิลต้องเป็นรูปแบบ 2026-12", true);
    if (d && !/^\d{4}-\d{2}-\d{2}$/.test(d)) return toast("วันครบกำหนดต้องเป็นรูปแบบ 2026-12-16", true);
    if (p !== O.period) { O.period = p; O.draft = loadDraft(); O.skipped.clear(); }
    O.due = d;
    ownerBill();
  };

  if (MYROLE === "viewer") {
    bottom("");

    bottom(`<button class="btn primary" id="run" ${ready.length ? "" : "disabled"}>${ready.length ? `ออกบิลและส่งเข้า LINE · ${ready.length} ห้อง` : "ยังไม่มีห้องที่จดมิเตอร์"}</button>`);

  const runBtn = $("run");

    btn.textContent = "กำลังออกบิลและส่งการ์ด…";
    try {
      const out = await api("/api/run", {
        method: "POST",

          period: O.period,
          due: O.due,
          readings: ready.map((r) => ({ room: r.room, ...O.draft[r.room] })),
        }),
      });
      const done = out.rooms.filter((x) => !x.error);
      const skipped = out.rooms.length - done.length;
      const prepaid = done.filter((x) => x.prepaid).map((x) => x.room);
      const sent = done.filter((x) => x.pushed).length;
      done.forEach((x) => delete O.draft[x.room]);
      saveDraft();
      toast(
        `ออกบิลรอบ ${periodTh(out.period)} แล้ว ${done.length} ห้อง · ส่งการ์ด ${sent} ห้อง` +
          (skipped ? ` · ข้าม ${skipped} ห้อง (แจ้งชำระแล้วหรือข้อมูลไม่ถูกต้อง)` : "") +
          (prepaid.length ? ` · ห้อง ${prepaid.join(", ")} แนบสลิปที่โอนไว้แล้ว รอยืนยัน` : "")
      );
      history.replaceState(null, "", "#home");
      await loadOwner();
    } catch (e) {
      toast(e.message, true);
      btn.disabled = false;
      btn.textContent = `ออกบิลและส่งเข้า LINE · ${ready.length} ห้อง`;
    }
  };
}

// `loaded` = the overdue list was just fetched, so draw it without fetching again.
function ownerReview(tab, loaded) {
  O.reviewTab = tab === "overdue" ? "overdue" : "pending";
  header("DormPlus · เจ้าของหอ", "ค้าง / รอตรวจ", "home");
  bottom("");
  const pending = O.rooms.filter((r) => r.bill?.status === "pending");
  // The list itself (periods, totals, days late) is the server's: it counts every unpaid period of
  // a room, not only the latest bill, and uses the dorm's date. Until it arrives, the latest-bill
  // count from /api/rooms stands in for the tab badge.
  const od = O.overdueData;
  const overdueCount = od ? od.rooms.length : O.rooms.filter((r) => isOverdue(r.bill)).length;
  if (O.reviewTab === "overdue" && !loaded) {
    loadOverdue().then(() => {
      if (route().startsWith("review") && O.reviewTab === "overdue") ownerReview("overdue", true);
    });
  }
  const unpaidLater = O.rooms.filter((r) => r.bill?.status === "unpaid" && !isOverdue(r.bill));

  const pendingCard = (r) => `
    <div class="card">
      <div class="slip">
        <div class="thumb" data-slip="${esc(r.room)}">${r.bill.slipPath ? "…" : "ไม่มีรูป"}</div>
        <div style="flex:1">
          <b>ห้อง ${esc(r.room)}</b>
          <div class="m">ยอดบิล ${fmt(r.bill.total)} บาท${r.bill.slipAt ? " · แจ้ง " + timeTh(r.bill.slipAt) : ""}</div>
          <div class="m">รอบบิล ${periodTh(r.bill.period)}</div>
          ${verifyLine(r.bill.slipVerify)}
        </div>
      </div>
      ${r.bill.slipPath ? `<button class="btn" style="margin-top:12px" data-open="${esc(r.room)}">ดูสลิป</button>` : ""}
      ${MYROLE !== "viewer" ? `<button class="btn" style="margin-top:8px" data-reject="${esc(r.room)}">สลิปไม่ถูกต้อง (ตีกลับ)</button>` : ""}
    </div>`;

  const overdueCard = (r) => `
    <div class="roomcard" style="cursor:default">
      <span><b>ห้อง ${esc(r.room)}</b><div class="m">${overdueRoomLine(r)}</div>
        <div class="m">งวด ${r.items.map((i) => periodTh(i.period)).join(" · ")}</div></span>
    </div>`;

  const body = O.reviewTab === "pending"
    ? (pending.length
        ? `${pending.map(pendingCard).join("")}<div class="hint">กด “ยืนยันการชำระ” ได้ที่การ์ดที่ส่งเข้าแชท LINE ของเจ้าของหอ</div>`
        : `<div class="card empty m">ไม่มีสลิปที่รอตรวจ</div>`)
    : (!od
        ? `<div class="card empty m">${O.overdueFailed ? "โหลดรายการค้างชำระไม่สำเร็จ — ลองเปิดหน้านี้ใหม่" : "กำลังโหลด…"}</div>`
        : od.rooms.length
          ? `<div class="stack">${od.rooms.map(overdueCard).join("")}</div>`
          : `<div class="card empty m">ไม่มีห้องค้างเกินกำหนด</div>`)
      + (unpaidLater.length ? `<div class="hint">ยังไม่ถึงกำหนดอีก ${unpaidLater.length} ห้อง (${unpaidLater.map((r) => esc(r.room)).join(", ")})</div>` : "");

  view.innerHTML = `
    <div class="seg">
      <button class="${O.reviewTab === "pending" ? "on" : ""}" data-tab="pending">รอตรวจสลิป ${pending.length}</button>
      <button class="${O.reviewTab === "overdue" ? "on" : ""}" data-tab="overdue">ค้างชำระ ${overdueCount}</button>
    </div>
    ${body}`;

  view.querySelectorAll("[data-tab]").forEach((el) => (el.onclick = () => history.replaceState(null, "", "#review/" + el.dataset.tab) || ownerReview(el.dataset.tab)));
  view.querySelectorAll("[data-open]").forEach((el) => (el.onclick = () => showSlip(el.dataset.open)));
  view.querySelectorAll("[data-reject]").forEach((el) => {
    const room = el.dataset.reject;
    el.onclick = () => rejectSlip(room, O.rooms.find((r) => r.room === room)?.bill);
  });
  view.querySelectorAll(".thumb[data-slip]").forEach(async (el) => {
    const room = el.dataset.slip;
    if (!O.rooms.find((r) => r.room === room)?.bill?.slipPath) return;
    el.onclick = () => showSlip(room);
    try { el.innerHTML = `<img src="${await slipUrl(room)}" alt="สลิป">`; } catch { el.textContent = "โหลดไม่ได้"; }
  });
}

// Owner: cancel a bill. Asks for the reason, then confirms, because the tenant is told and a paid
// bill loses its receipt; the only way back is to issue the bill again.
async function rejectSlip(room, bill) {
  const reason = (prompt(`เหตุผลที่ตีกลับสลิปห้อง ${room} (ผู้เช่าจะเห็นข้อความนี้)`) || "").trim();
  if (!reason) return toast("ต้องใส่เหตุผลก่อนตีกลับ", true);
  if (reason.length > 200) return toast("เหตุผลยาวได้ไม่เกิน 200 ตัวอักษร", true);
  if (!confirm(`ตีกลับสลิปห้อง ${room}? ผู้เช่าจะได้รับแจ้งและแนบสลิปใหม่ได้`)) return;
  try {
    await api("/api/bill", {
      method: "POST",
      body: JSON.stringify({ action: "reject", room, period: bill.period, reason }),
    });
    toast(`ตีกลับสลิปห้อง ${room} แล้ว — แจ้งผู้เช่าให้แนบใหม่`);
    await loadOwner();
    ownerReview(O.reviewTab);
  } catch (e) {
    toast(e.message, true);
  }
}

async function voidBill(room, bill) {
  const reason = (prompt(`เหตุผลที่ยกเลิกบิลห้อง ${room} รอบ ${periodTh(bill.period)} (ผู้เช่าจะเห็นข้อความนี้)`) || "").trim();
  if (!reason) return toast("ต้องใส่เหตุผลก่อนยกเลิกบิล", true);
  if (reason.length > 200) return toast("เหตุผลยาวได้ไม่เกิน 200 ตัวอักษร", true);
  const paidNote = bill.status === "paid" ? " บิลนี้ชำระแล้ว — ใบเสร็จจะถูกยกเลิกด้วย" : "";
  if (!confirm(`ยกเลิกบิลห้อง ${room} รอบ ${periodTh(bill.period)}?${paidNote}\nเหตุผล: ${reason}\nผู้เช่าจะได้รับแจ้ง และออกบิลใหม่ได้ภายหลัง`)) return;
  const btn = $("voidBtn");
  if (btn) btn.disabled = true;
  try {
    const out = await api("/api/bill", { method: "POST", body: JSON.stringify({ action: "void", room, period: bill.period, reason }) });
    toast(out.refund ? `ยกเลิกแล้ว — ต้องคืนเงินผู้เช่า ${fmt(out.refund)} บาท` : `ยกเลิกบิลห้อง ${room} แล้ว`);
    await loadOwner();
  } catch (e) {
    toast(e.message, true);
    if (btn) btn.disabled = false;
  }
}

// Owner: record that refund money went back to the tenant: a cancelled paid bill ("void") or the
// extra of an overpaid one ("overpaid"). The app does not move money; this only closes the
// "ต้องคืนเงิน" reminder, so confirm first.
async function markRefunded(room, bill, btn, kind = "void") {
  if (!confirm(`ยืนยันว่าคืนเงิน ${fmt(bill.refundDue)} บาท ให้ห้อง ${room} แล้ว?\nบันทึกแล้วแก้กลับไม่ได้`)) return;
  if (btn) btn.disabled = true;
  try {
    await api("/api/bill", { method: "POST", body: JSON.stringify({ action: "refunded", kind, room, period: bill.period, rev: bill.rev || 1 }) });
    toast(`บันทึกว่าคืนเงินห้อง ${room} แล้ว`);
    await loadOwner();
  } catch (e) {
    toast(e.message, true);
    if (btn) btn.disabled = false;
  }
}

// The tenant moved out. It is the same call as the QR screen's "เปลี่ยนผู้เช่า": unbind the primary
// and every roommate, rotate the door QR, and start a new tenancy. Unpaid bills stay on the record.
async function removeTenant(room) {
  const ok = confirm(
    `ยกเลิกผู้เช่าห้อง ${room}?\n\n· ผู้เช่าทุกคน (หลัก + สมาชิก) จะหลุดจากห้องนี้\n` +
    `· QR หน้าห้องเดิมใช้ไม่ได้ — ต้องปริ้นใหม่\n` +
    `· บิลที่ค้างยังอยู่ เจ้าของหอต้องเก็บเงินเอง`
  );
  if (!ok) return;
  const btn = $("endTenantBtn");
  if (btn) btn.disabled = true;
  try {
    const r = await api(`/api/qr?room=${encodeURIComponent(room)}`, { method: "POST" });
    toast((r.unbound ? `ยกเลิกผู้เช่าห้อง ${room} แล้ว` : `ห้อง ${room} ยังไม่มีผู้เช่า`) +
      (r.prepayArchived ? " · มีสลิปโอนล่วงหน้าค้าง — ตรวจสอบ/คืนเงินเอง" : ""));
    await loadOwner();
    ownerEntry(room);
  } catch (e) {
    toast(e.message, true);
    if (btn) btn.disabled = false;
  }
}

async function editRoom(room, current) {
  const c = current || {};
  const ask = (label, value) => {
    const raw = prompt(`${label} (บาท) — ห้อง ${room}`, String(value ?? 0));
    return raw === null ? null : raw.trim();
  };
  const rent = ask("ค่าเช่าต่อเดือน", c.rent);
  if (rent === null) return;
  const waterRate = ask("ค่าน้ำต่อหน่วย", c.waterRate);
  if (waterRate === null) return;
  const elecRate = ask("ค่าไฟต่อหน่วย", c.elecRate);
  if (elecRate === null) return;
  if (![rent, waterRate, elecRate].every((v) => /^\d+$/.test(v))) {
    return toast("ใส่เป็นจำนวนเต็มตั้งแต่ 0 ขึ้นไป", true);
  }
  try {
    await api("/api/rooms", {
      method: "POST",
      body: JSON.stringify({ room, rent: Number(rent), waterRate: Number(waterRate), elecRate: Number(elecRate) }),
    });
    toast(`บันทึกราคาห้อง ${room} แล้ว — มีผลกับบิลที่ออกใหม่`);
    await loadOwner();
    go(`entry/${encodeURIComponent(room)}`);
  } catch (e) {
    toast(e.message, true);
  }
}

async function showSlip(room, advance) {
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.innerHTML = `<div class="card"><div class="row"><b>สลิป${advance ? "โอนล่วงหน้า" : ""}ห้อง ${esc(room)}</b><button class="btn sm" id="closeSlip">ปิด</button></div>
    <div class="m" id="slipBody" style="margin-top:12px">กำลังโหลด…</div></div>`;
  document.body.appendChild(sheet);
  const close = () => sheet.remove();
  sheet.onclick = (e) => { if (e.target === sheet) close(); };
  $("closeSlip").onclick = close;
  try {
    $("slipBody").outerHTML = `<img src="${await slipUrl(room, advance)}" alt="สลิปห้อง ${esc(room)}">`;
  } catch (e) {
    $("slipBody").className = "err";
    $("slipBody").textContent = e.message;
  }
}

boot();
</script>
