version: 2
updates:
  # Vercel functions + LIFF tests (line-app/package.json)
  - package-ecosystem: npm
    directory: /line-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Playwright is its own package, never deployed
  - package-ecosystem: npm
    directory: /line-app/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # FastAPI backend (backend/pyproject.toml)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
