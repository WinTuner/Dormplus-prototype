name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The deployed LINE app (line-app/): plain Node, no dependencies, no network.
  line-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install runtime dependencies
        working-directory: line-app
        run: npm ci --no-audit --no-fund

      - name: Syntax check every handler
        working-directory: line-app
        run: |
          for f in api/*.js; do node --check "$f"; done

      - name: Offline smoke test (signature, Flex cards, auth guards)
        working-directory: line-app
        run: node smoke.js

      - name: Offline handler tests (dev gate, QR binding, rate limit, payment confirm, bill issuing)
        working-directory: line-app
        run: node smoke-handlers.js

      - name: Offline read tests (concurrency, history, permissions)
        working-directory: line-app
        run: node smoke-reads.js

      - name: Use case tests
        working-directory: line-app
        run: node smoke-usecases.js

      - name: Reminder cron tests
        working-directory: line-app
        run: node smoke-cron.js

      # The LIFF page carries ~600 lines of inline JS that nothing else checks: a syntax error
      # there ships straight to production and only shows up as a blank screen in LINE.
      - name: Check the LIFF page script parses
        working-directory: line-app
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('liff/bill.html','utf8');const m=h.match(/<script>([\s\S]*)<\/script>/);if(!m)throw new Error('no inline script');fs.writeFileSync('/tmp/page.js',m[1]);"
          node --check /tmp/page.js
          echo "liff/bill.html: inline script parses"

  # Playwright UI tests of the LIFF page (line-app/e2e is its own npm package, never deployed).
  line-app-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            line-app/package-lock.json
            line-app/e2e/package-lock.json

      - name: Install line-app dependencies
        working-directory: line-app
        run: npm ci --no-audit --no-fund

      - name: Install e2e dependencies
        working-directory: line-app/e2e
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: line-app/e2e
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        working-directory: line-app/e2e
        run: npx playwright test

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: line-app-e2e-report
          path: |
            line-app/e2e/playwright-report
            line-app/e2e/test-results
          retention-days: 7

  # The real backend (FastAPI + Postgres). Skips itself until backend/ exists on the branch,
  # so this file is safe to merge before the backend lands.
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: domplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Does backend/ exist on this branch?
        id: probe
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "backend/ not on this branch yet — skipping"
          fi

      - uses: actions/setup-python@v5
        if: steps.probe.outputs.present == 'yes'
        with:
          python-version: "3.12"

      - name: Install backend + dev deps
        if: steps.probe.outputs.present == 'yes'
        run: pip install -e "backend[dev]"

      - name: Run backend tests
        if: steps.probe.outputs.present == 'yes'
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/domplus_test
          DEV_AUTH: "true"
        run: pytest -q
