<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DormPlus — ผู้เช่า</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/web/app.css">
</head>
<body>
<div class="app">
  <header>
    <div class="kick">ผู้เช่า · รอบบิล</div>
    <h1 id="title">ใบแจ้งหนี้</h1>
  </header>

  <main>
    <div class="card" id="bill">
      <div class="m">กำลังโหลด…</div>
    </div>

    <div class="card2">
      <div class="row"><b>แนบสลิป</b><span class="pill" id="statusPill">—</span></div>
      <div class="m" id="slipNote" style="margin-top:6px">ยังไม่ได้แนบสลิป</div>
      <button class="btn" style="margin-top:12px" id="slipBtn">แนบสลิป &amp; แจ้งชำระ</button>
      <div class="hint" style="margin-top:8px">สถานะจะเปลี่ยนเป็น “รอตรวจสอบ” จนกว่าเจ้าของหอจะยืนยัน</div>
    </div>

    <div class="card2">
      <div class="row"><span class="m">โอนผ่าน</span><span>พร้อมเพย์ / QR ในบิล</span></div>
      <div class="row" style="margin-top:8px"><span class="m">ครบกำหนด</span><span id="due">—</span></div>
    </div>
  </main>
</div>

<script src="/web/api.js"></script>
<script>
let inv = null;

async function load() {
  const data = await API.invoices();
  const open = data.items.find(i => i.status !== 'paid') || data.items[0];
  if (!open) {
    document.getElementById('bill').innerHTML = '<div class="m">ยังไม่มีใบแจ้งหนี้สำหรับรอบนี้</div>';
    return;
  }
  inv = open;
  document.getElementById('title').textContent = 'ห้อง ' + open.room_no;
  document.getElementById('due').textContent = open.due_date;
  document.getElementById('bill').innerHTML =
    '<div class="row"><span class="m">ยอดที่ต้องชำระ</span><span class="pill ' +
      (open.status === 'unpaid' ? 'warn' : '') + '">' +
      (open.status === 'paid' ? 'ชำระแล้ว' : open.status === 'pending' ? 'รอตรวจสอบ' : 'ยังไม่ชำระ') + '</span></div>' +
    '<div class="big" style="margin-top:6px">' + fmt(open.total) + ' <span style="font-size:14px;color:var(--muted)">บาท</span></div>' +
    '<div class="m" style="margin-top:10px">ห้อง ' + open.room_no + ' · ครบกำหนด ' + open.due_date + '</div>';

  const pill = document.getElementById('statusPill');
  const note = document.getElementById('slipNote');
  const btn = document.getElementById('slipBtn');
  if (open.status === 'paid') {
    pill.textContent = 'ชำระแล้ว'; pill.className = 'pill';
    note.textContent = 'ใบเสร็จออกแล้ว';
    btn.style.display = 'none';
  } else if (open.status === 'pending') {
    pill.textContent = 'รอตรวจสอบ'; pill.className = 'pill warn';
    note.textContent = 'แนบสลิปแล้ว — รอเจ้าของหอยืนยัน';
    btn.style.display = 'none';
  } else {
    pill.textContent = 'ยังไม่ชำระ'; pill.className = 'pill warn';
    note.textContent = 'ยังไม่ได้แนบสลิป';
    btn.style.display = 'block';
  }
}

document.getElementById('slipBtn').onclick = async () => {
  if (!inv) return;
  const res = await API.slip(inv.id, 's3://slips/demo.jpg').catch(e => ({ error: e.message }));
  if (res.error) { alert(res.error); return; }
  await load();
};

load().catch(e => {
  document.getElementById('bill').innerHTML = '<div class="m">ต่อ API ไม่ได้: ' + e.message + '</div>';
});
</script>
</body>
</html>
